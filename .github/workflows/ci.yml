# CI (#7): build everything, run the unit tests and the smoke test on every pull request and
# every push to main. The smoke test runs the real sender and receiver directly over loopback;
# once run_one.sh exists (#10), it also runs a transfer through the emulator.
name: CI

on:
  push:
    branches: [main]
  pull_request: # any base branch, so stacked PRs are checked too

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # the UDP tests wait on sockets; a hang must not run for hours
    steps:
      - uses: actions/checkout@v7

      - name: Compiler version
        run: gcc --version

      # -Werror only here: a new warning fails the PR, local builds stay as they are
      - name: Build
        run: make CFLAGS="-O2 -g -Werror"

      - name: Unit tests
        run: make test CFLAGS="-O2 -g -Werror"

      - name: Smoke test
        run: make smoke CFLAGS="-O2 -g -Werror"

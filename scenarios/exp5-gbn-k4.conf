# Experiment 5, Go-Back-N, k = 4: drop ACKs 1 to 16, all ACKs of a first window of 2^k packets.
# Every other value is the baseline of scenarios/baseline.conf.
# run_one.sh (#10) replaces seed, log_path and the two ports for each run.
listen_port=9001
receiver_port=9002
log_path=runs/emulator.log
seed=337

data_rate_bps=1000000
ack_rate_bps=1000000

data_queue=128
ack_queue=128

data_delay_ms=20
ack_delay_ms=20

data_jitter_ms=0
ack_jitter_ms=0

data_loss=0
ack_loss=0

data_corruption=0
ack_corruption=0

data_duplication=0
ack_duplication=0

data_reordering=0
ack_reordering=0

drop ack 1
drop ack 2
drop ack 3
drop ack 4
drop ack 5
drop ack 6
drop ack 7
drop ack 8
drop ack 9
drop ack 10
drop ack 11
drop ack 12
drop ack 13
drop ack 14
drop ack 15
drop ack 16

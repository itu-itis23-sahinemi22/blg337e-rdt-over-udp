# Robustness (#16): every impairment at 3 % in both directions, jitter 5 ms.
# Every other value is the baseline of scenarios/baseline.conf.
# run_one.sh (#10) replaces seed, log_path and the two ports for each run.
listen_port=9001
receiver_port=9002
log_path=runs/emulator.log
seed=337

data_rate_bps=1000000
ack_rate_bps=1000000

data_queue=128
ack_queue=128

data_delay_ms=20
ack_delay_ms=20

data_jitter_ms=5
ack_jitter_ms=5

data_loss=0.03
ack_loss=0.03

data_corruption=0.03
ack_corruption=0.03

data_duplication=0.03
ack_duplication=0.03

data_reordering=0.03
ack_reordering=0.03

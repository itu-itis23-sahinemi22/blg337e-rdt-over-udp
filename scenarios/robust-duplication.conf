# Robustness (#16): duplication 10 %, both directions.
# Every other value is the baseline of scenarios/baseline.conf.
# run_one.sh (#10) replaces seed, log_path and the two ports for each run.
listen_port=9001
receiver_port=9002
log_path=runs/emulator.log
seed=337

data_rate_bps=1000000
ack_rate_bps=1000000

data_queue=128
ack_queue=128

data_delay_ms=20
ack_delay_ms=20

data_jitter_ms=0
ack_jitter_ms=0

data_loss=0
ack_loss=0

data_corruption=0
ack_corruption=0

data_duplication=0.10
ack_duplication=0.10

data_reordering=0
ack_reordering=0
